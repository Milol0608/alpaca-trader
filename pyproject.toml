[project]
name = "alpaca-trader"
version = "0.1.0"
description = "Systematic stock strategies, backtested walk-forward, then paper-traded on Alpaca. Live trading is gated."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "polars>=1.0",
    "numpy>=2.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
